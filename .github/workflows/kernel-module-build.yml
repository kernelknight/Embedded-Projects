name: Kernel module build

on:
  push:
  pull_request:

jobs:
  hd44780-lcd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic

      - name: Build HD44780 LCD driver
        run: |
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort | tail -n 1)"
          test -n "$KDIR"
          make -C Linux_Device_Drivers/HD44780_Char_LCD KDIR="$KDIR"

      - name: Build HD44780 USB LCD driver
        run: |
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort | tail -n 1)"
          test -n "$KDIR"
          make -C Linux_Device_Drivers/HD44780_USB_LCD KDIR="$KDIR"
